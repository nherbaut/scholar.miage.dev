<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Works → References (forward & backward)</title>
  <style>
    :root{
      --bg:#0b0f14; --fg:#e6edf3; --muted:#9fb0c0;
      --work:#7aa2f7;            /* works (middle ring) */
      --ref:#f7768e;             /* forward refs (center) */
      --ref-back:#94e2d5;        /* backward refs (outer ring) */
      --work-neigh:#22c55e;      /* highlight works  */
      --ref-neigh:#f59e0b;       /* highlight forward refs */
      --ref-back-neigh:#10b981;  /* highlight backward refs */
      --link:#6b7280; --panel:#10151c; --accent:#a6e3a1;
    }
    html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,Segoe UI,Roboto,Ubuntu,Cantarell,Helvetica,Arial}
    #app{display:grid;grid-template-rows:auto 1fr;height:100%}
    header{display:flex;gap:.75rem;align-items:center;padding:.6rem .9rem;background:var(--panel);border-bottom:1px solid #1b2530;position:sticky;top:0;z-index:2}
    header button{background:#182330;color:var(--fg);border:1px solid #2a394b;padding:.45rem .7rem;border-radius:.5rem;cursor:pointer;font-size:14px}
    header button:hover{border-color:#3b516b}
    header .meta{font-size:12px;color:var(--muted);margin-left:.5rem}
    #container{position:relative}
    svg{width:100%;height:100%;display:block}

    .link{stroke:var(--link);stroke-opacity:.35}
    .link.highlight{stroke-opacity:.85}
    .link.back{stroke-dasharray:5 4}
    .link.author-hit{stroke:#eab308;stroke-opacity:.95}

    .node{stroke:#0a0f14;stroke-width:1px;cursor:grab}
    .node:active{cursor:grabbing}
    .node.work{fill:var(--work)}
    .node.ref{fill:var(--ref)}
    .node.ref_back{fill:var(--ref-back)}
    .node.author-hit{stroke:#facc15;stroke-width:2.5px}

    .node.work.neighbor{fill:var(--work-neigh)}
    .node.ref.neighbor{fill:var(--ref-neigh)}
    .node.ref_back.neighbor{fill:var(--ref-back-neigh)}

    .label{pointer-events:none;font-size:11px;fill:#cdd6f4;opacity:.85}
    .legend{position:absolute;left:10px;bottom:10px;background:rgba(16,21,28,.9);border:1px solid #24303d;border-radius:8px;padding:.5rem .7rem;font-size:12px}
    .legend .swatch{width:.75rem;height:.75rem;display:inline-block;border-radius:999px;margin-right:.35rem;vertical-align:middle}

    #tooltip{position:absolute;z-index:10;pointer-events:none;background:#111827;color:var(--fg);border:1px solid #253244;border-radius:.5rem;padding:.6rem .7rem;max-width:420px;box-shadow:0 10px 30px rgba(0,0,0,.35);display:none}
    #tooltip h3{margin:0 0 .35rem 0;font-size:14px}
    #tooltip .row{font-size:12px;color:var(--muted);margin-top:.25rem}
    #tooltip a{color:var(--accent);text-decoration:none}
    #tooltip a:hover{text-decoration:underline}

    .ring{fill:none;stroke:#223042;stroke-dasharray:4 6;stroke-opacity:.5}

    .modal-overlay{position:fixed;inset:0;background:rgba(3,6,10,.6);display:none;align-items:center;justify-content:center;z-index:20}
    .modal{background:#0f141b;border:1px solid #223042;border-radius:10px;min-width:340px;max-width:520px;padding:16px 18px;box-shadow:0 16px 40px rgba(0,0,0,.45)}
    .modal h3{margin:0 0 10px 0;font-size:16px}
    .modal .row{display:flex;align-items:center;gap:10px;margin:10px 0}
    .modal .kw-dot{width:10px;height:10px;border-radius:999px;display:inline-block;border:1px solid #1b2530}
    .modal label{font-size:12px;color:var(--muted);min-width:110px}
    .modal input[type=range]{width:220px}
    .modal input[type=number], .modal input[type=text]{background:#0b0f14;border:1px solid #223042;color:var(--fg);padding:.35rem .5rem;border-radius:.4rem;width:120px}
    .modal .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}

    #ctx-menu{position:absolute;z-index:30;display:none;background:#0f141b;border:1px solid #223042;border-radius:8px;min-width:180px;box-shadow:0 12px 24px rgba(0,0,0,.45);padding:6px}
    #ctx-menu button{display:block;width:100%;text-align:left;background:transparent;color:var(--fg);border:0;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:13px}
    #ctx-menu button:hover{background:#19212b}
    #ctx-menu button[disabled]{opacity:.45;cursor:not-allowed}

    #authors-panel{position:absolute;top:48px;left:12px;background:#0f141b;border:1px solid #223042;border-radius:10px;min-width:260px;max-height:60vh;overflow:hidden;box-shadow:0 16px 40px rgba(0,0,0,.45);display:none;z-index:25}
    #authors-panel header{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid #1b2530;background:#0f141b;position:sticky;top:0}
    #authors-panel input{flex:1;background:#0b0f14;border:1px solid #223042;color:var(--fg);padding:.35rem .5rem;border-radius:.4rem;font-size:12px}
    #authors-panel .list{max-height:50vh;overflow:auto;padding:6px}
    #authors-panel button.item{display:block;width:100%;text-align:left;background:transparent;color:var(--fg);border:0;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:12px}
    #authors-panel button.item:hover{background:#19212b}
    #authors-panel .muted{color:var(--muted);font-size:12px;padding:6px 8px}
  </style>
</head>
<body>
  <div id="app">
    <header>
      <button id="btn-reset" title="Reset nodes to initial layout">Reset layout</button>
      <button id="btn-fit" title="Zoom/Pan to fit graph">Fit to view</button>
      <button id="btn-download" title="Download JSON">Download JSON</button>
      <button id="btn-filters" title="Configure options">Options</button>
      <button id="btn-communities" title="Show community view">Communities</button>
      <button id="btn-authors" title="Filter by author">Authors</button>
      <div class="meta" id="meta">Loading…</div>
    </header>
    <div id="container">
      <svg id="svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="legend">
        <div><span class="swatch" style="background: var(--ref)"></span>Forward references (center)</div>
        <div><span class="swatch" style="background: var(--work)"></span>Input works (middle ring)</div>
        <div><span class="swatch" style="background: var(--ref-back)"></span>Backward refs (outer ring)</div>
      </div>
      <div id="tooltip"></div>
      <div id="authors-panel">
        <header>
          <button id="authors-reset" title="Clear author selection">Reset</button>
          <input id="authors-filter" type="text" placeholder="Filter authors…" />
        </header>
        <div class="list" id="authors-list"></div>
      </div>
      <div id="ctx-menu">
        <button id="ctx-export-all">Export community CSV (all)</button>
        <button id="ctx-export-visible">Export community CSV (visible)</button>
        <button id="ctx-go">Go to paper</button>
      </div>
    </div>
  </div>

  <div id="filter-overlay" class="modal-overlay" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="filter-title">
      <h3 id="filter-title">Options</h3>
      <div class="row">
        <label for="thFwd">Threshold (forward)</label>
        <input id="thFwd" type="range" min="2" max="20" value="2" />
        <span id="thFwdVal">2</span>
      </div>
      <div class="row">
        <label for="thBack">Threshold (backward)</label>
        <input id="thBack" type="range" min="1" max="20" value="1" />
        <span id="thBackVal">1</span>
      </div>
      <div class="row">
        <label for="minYear">Min year</label>
        <input id="minYear" type="number" min="0" max="9999" />
      </div>
      <div class="row">
        <label for="maxYear">Max year</label>
        <input id="maxYear" type="number" min="0" max="9999" />
      </div>
      <div class="row">
        <label for="resolution">Resolution</label>
        <input id="resolution" type="number" min="0.1" max="5" step="0.1" value="1.0" />
      </div>
      <div class="row">
        <label for="shadeByAge">Shade by age</label>
        <input id="shadeByAge" type="checkbox" />
        <input id="shadeSensitivity" type="range" min="0.5" max="5" step="0.1" value="1" />
        <span id="shadeSensitivityVal">1.0</span>
      </div>
      <div class="row">
        <label for="kwWork"><span class="kw-dot" style="background: var(--work)"></span> Keyword (works)</label>
        <input id="kwWork" type="text" placeholder="e.g. transformer" />
      </div>
      <div class="row">
        <label for="kwFwd"><span class="kw-dot" style="background: var(--ref)"></span> Keyword (forward)</label>
        <input id="kwFwd" type="text" placeholder="e.g. citation" />
      </div>
      <div class="row">
        <label for="kwBack"><span class="kw-dot" style="background: var(--ref-back)"></span> Keyword (backward)</label>
        <input id="kwBack" type="text" placeholder="e.g. survey" />
      </div>
      <div class="actions">
        <button id="btn-close-filters">Close</button>
        <button id="btn-apply-filters">Apply</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script>
  const svg = d3.select('#svg');
  const width = 1200, height = 800;

  const gZoom  = svg.append('g');
  const gRings = gZoom.append('g');
  const gLinks = gZoom.append('g');
  const gNodes = gZoom.append('g');
  const gLabels= gZoom.append('g');

  const tooltip  = document.getElementById('tooltip');
  const metaEl   = document.getElementById('meta');
  const thFwdEl  = document.getElementById('thFwd');
  const thBackEl = document.getElementById('thBack');
  const thFwdVal = document.getElementById('thFwdVal');
  const thBackVal= document.getElementById('thBackVal');
  const minYearEl = document.getElementById('minYear');
  const maxYearEl = document.getElementById('maxYear');
  const resolutionEl = document.getElementById('resolution');
  const shadeByAgeEl = document.getElementById('shadeByAge');
  const shadeSensitivityEl = document.getElementById('shadeSensitivity');
  const shadeSensitivityVal = document.getElementById('shadeSensitivityVal');
  const kwWorkEl = document.getElementById('kwWork');
  const kwFwdEl = document.getElementById('kwFwd');
  const kwBackEl = document.getElementById('kwBack');
  const filterOverlay = document.getElementById('filter-overlay');
  const btnFilters = document.getElementById('btn-filters');
  const btnApplyFilters = document.getElementById('btn-apply-filters');
  const btnCloseFilters = document.getElementById('btn-close-filters');
  const btnCommunities = document.getElementById('btn-communities');
  const btnAuthors = document.getElementById('btn-authors');
  const authorsPanel = document.getElementById('authors-panel');
  const authorsListEl = document.getElementById('authors-list');
  const authorsFilterEl = document.getElementById('authors-filter');
  const authorsResetEl = document.getElementById('authors-reset');
  const btnDownload = document.getElementById('btn-download');
  const ctxMenu = document.getElementById('ctx-menu');
  const ctxExportAll = document.getElementById('ctx-export-all');
  const ctxExportVisible = document.getElementById('ctx-export-visible');
  const ctxGo = document.getElementById('ctx-go');
  let ctxNode = null;
  let ctxVisibleNodes = null;

  let fullData = null;
  let communityData = null;
  let communityResolution = null;
  let viewMode = 'graph';
  let currentVisibleNodes = [];
  let currentVisibleLinks = [];
  let selectedAuthor = '';
  // Data URL (backend-provided ID must be templated on server side)
  const DATA_URL = '/network/compute/{{work_list_id}}';
  let currentDataURL = DATA_URL;
  const currentYear = new Date().getFullYear();
  const rootStyles = getComputedStyle(document.documentElement);
  const filters = {
    thFwd: 2,
    thBack: 1,
    minYear: 1900,
    maxYear: currentYear,
    resolution: 1.0,
    shadeByAge: false,
    shadeSensitivity: 1.0,
    keywordWork: '',
    keywordFwd: '',
    keywordBack: ''
  };

  function cssVar(name, fallback){
    const value = rootStyles.getPropertyValue(name).trim();
    return value || fallback;
  }

  function yearExtent(nodes){
    const years = (nodes || [])
      .map(n => Number(n.publication_year))
      .filter(y => Number.isFinite(y));
    if (!years.length) return [currentYear - 1, currentYear];
    const min = Math.min(...years);
    const max = Math.max(...years);
    return min === max ? [min - 1, max] : [min, max];
  }

  function nodeBaseColor(d, colorScale){
    if (colorScale) return colorScale(d.community ?? -1);
    if (d.type === 'work') return cssVar('--work', '#7aa2f7');
    if (d.type === 'ref_back') return cssVar('--ref-back', '#94e2d5');
    return cssVar('--ref', '#f7768e');
  }

  function buildNodeFill(activeNodes, activeFilters, colorScale){
    if (!activeFilters.shadeByAge) {
      return (d) => nodeBaseColor(d, colorScale);
    }
    const [minYear, maxYear] = yearExtent(activeNodes);
    const ageScale = d3.scaleLinear()
      .domain([minYear, maxYear])
      .range([0, 1])
      .clamp(true);
    return (d) => {
      const base = d3.color(nodeBaseColor(d, colorScale));
      const publicationYear = Number(d.publication_year);
      if (!base || !Number.isFinite(publicationYear)) return nodeBaseColor(d, colorScale);
      const rawMix = 1 - ageScale(publicationYear);
      const sensitivity = Number.isFinite(activeFilters.shadeSensitivity) ? activeFilters.shadeSensitivity : 1.0;
      const adjustedMix = Math.pow(rawMix, 1 / Math.max(0.1, sensitivity));
      const mix = 0.18 + (adjustedMix * 0.77);
      return d3.interpolateRgb(base.formatRgb(), '#ffffff')(mix);
    };
  }

  const zoom = d3.zoom().scaleExtent([0.25, 3]).on('zoom', (ev)=>{ gZoom.attr('transform', ev.transform); });
  svg.call(zoom);

  // Simulation for CENTER refs only (forward).
  const sim = d3.forceSimulation()
    .force('charge', d3.forceManyBody().strength(-40))
    .force('center', d3.forceCenter(width/2, height/2))
    .force('collide', d3.forceCollide().radius(d => d.type === 'ref' ? 18 + Math.sqrt(d.count || 1)*2 : 10))
    .alphaDecay(0.05);
  const simCommunity = d3.forceSimulation();

  function computeInitialPositions(data){
    const cx = width/2, cy = height/2;
    const works    = data.nodes.filter(n => n.type === 'work');
    const refs     = data.nodes.filter(n => n.type === 'ref');
    const refsBack = data.nodes.filter(n => n.type === 'ref_back');

    const R_work = Math.min(width, height) * 0.42; // middle ring
    const R_back = Math.min(width, height) * 0.50; // outer ring

    // Works on middle ring (pinned)
    works.forEach((n, i) => {
      const theta = (i / Math.max(1, works.length)) * 2 * Math.PI;
      const x = cx + R_work * Math.cos(theta);
      const y = cy + R_work * Math.sin(theta);
      n.x = n.fx = x; n.y = n.fy = y;
      n.initialX = x; n.initialY = y;
    });

    // Forward refs near center (free, simulated)
    refs.forEach(n => {
      const jitter = 40;
      n.x = cx + (Math.random()-0.5)*jitter;
      n.y = cy + (Math.random()-0.5)*jitter;
      n.initialX = n.x; n.initialY = n.y;
      n.fx = null; n.fy = null;
    });

    // Backward refs on outer ring (pinned)
    refsBack.forEach((n, i) => {
      const theta = (i / Math.max(1, refsBack.length)) * 2 * Math.PI;
      const x = cx + R_back * Math.cos(theta);
      const y = cy + R_back * Math.sin(theta);
      n.x = n.fx = x; n.y = n.fy = y;
      n.initialX = x; n.initialY = y;
    });

    // Draw rings
    gRings.selectAll('circle').data([R_work, R_back])
      .join(
        enter => enter.append('circle').attr('class','ring')
          .attr('cx', cx).attr('cy', cy).attr('r', d => d),
        update => update.attr('r', d => d),
        exit => exit.remove()
      );
  }

  function filterData(data, activeFilters){
    if (!data || !data.nodes || !data.links) return {nodes: [], links: []};
    const refsKept     = new Set(data.nodes.filter(n => n.type==='ref'      && (n.count||0) >= activeFilters.thFwd).map(n=>n.id));
    const refsBackKept = new Set(data.nodes.filter(n => n.type==='ref_back' && (n.count||0) >= activeFilters.thBack).map(n=>n.id));

    const keywordWork = String(activeFilters.keywordWork || '').trim().toLowerCase();
    const keywordFwd = String(activeFilters.keywordFwd || '').trim().toLowerCase();
    const keywordBack = String(activeFilters.keywordBack || '').trim().toLowerCase();

    const worksFiltered = data.nodes.filter(n => n.type === 'work').filter(n => {
      const py = Number(n.publication_year);
      const yearOk = Number.isFinite(py) ? (py >= activeFilters.minYear && py <= activeFilters.maxYear) : true;
      if (!yearOk) return false;
      if (!keywordWork) return true;
      const hay = [
        n.title || '',
        n.venue || '',
        (n.authors || []).join(' ')
      ].join(' ').toLowerCase();
      return hay.includes(keywordWork);
    });
    const keepWorkIds = new Set(worksFiltered.map(n => String(n.id)));

    const filteredLinks = data.links.filter(l => {
      const s = String(typeof l.source === 'object' ? l.source.id : l.source);
      const t = String(typeof l.target === 'object' ? l.target.id : l.target);
      if (!keepWorkIds.has(s)) return false;
      return refsKept.has(t) || refsBackKept.has(t);
    });

    const linkedRefIds = new Set(filteredLinks.map(l => String(typeof l.target === 'object' ? l.target.id : l.target)));
    const filteredNodes = data.nodes.filter(n => {
      if (n.type === 'work') return keepWorkIds.has(String(n.id));
      return linkedRefIds.has(String(n.id));
    });

    const finalNodes = filteredNodes.filter(n => {
      if (n.type === 'ref') {
        if (!keywordFwd) return true;
        const hay = [
          n.title || '',
          n.venue || '',
          (n.authors || []).join(' ')
        ].join(' ').toLowerCase();
        return hay.includes(keywordFwd);
      }
      if (n.type === 'ref_back') {
        if (!keywordBack) return true;
        const hay = [
          n.title || '',
          n.venue || '',
          (n.authors || []).join(' ')
        ].join(' ').toLowerCase();
        return hay.includes(keywordBack);
      }
      return true;
    });

    const finalNodeIds = new Set(finalNodes.map(n => String(n.id)));
    const finalLinks = filteredLinks.filter(l => {
      const t = String(typeof l.target === 'object' ? l.target.id : l.target);
      return finalNodeIds.has(t);
    });

    return {nodes: finalNodes, links: finalLinks, keywordWork, keywordFwd, keywordBack};
  }

  function renderGraph(data, activeFilters){
    simCommunity.stop();
    const safeData = JSON.parse(JSON.stringify(data || {nodes: [], links: []}));
    const {nodes: finalNodes, links: finalLinks, keywordWork, keywordFwd, keywordBack} = filterData(safeData, activeFilters);
    currentVisibleNodes = finalNodes;
    currentVisibleLinks = finalLinks;

    // Adjacency maps
    const refsByWorkFwd   = new Map();
    const refsByWorkBack  = new Map();
    const worksByRefFwd   = new Map();
    const worksByRefBack  = new Map();

    const nodeIds = new Set(finalNodes.map(n => String(n.id)));

    for(const l of finalLinks){
      const s = String(typeof l.source === 'object' ? l.source.id : l.source);
      const t = String(typeof l.target === 'object' ? l.target.id : l.target);
      const kind = (l.kind === 'back') ? 'back' : 'forward';
      if(!nodeIds.has(s)) continue;

      if(kind === 'forward'){
        if(!refsByWorkFwd.has(s)) refsByWorkFwd.set(s, new Set());
        if(!worksByRefFwd.has(t)) worksByRefFwd.set(t, new Set());
        refsByWorkFwd.get(s).add(t);
        worksByRefFwd.get(t).add(s);
      }else{
        if(!refsByWorkBack.has(s)) refsByWorkBack.set(s, new Set());
        if(!worksByRefBack.has(t)) worksByRefBack.set(t, new Set());
        refsByWorkBack.get(s).add(t);
        worksByRefBack.get(t).add(s);
      }
    }

    const workIds = finalNodes.filter(n => n.type === 'work').map(n => String(n.id));
    const workCiteCount = new Map(workIds.map(id => [id, 0]));
    for (const [refb, ws] of worksByRefBack.entries()) {
      for (const w of ws) {
        if (workCiteCount.has(w)) workCiteCount.set(w, workCiteCount.get(w) + 1);
      }
    }
    const maxCites = Math.max(1, ...workIds.map(id => workCiteCount.get(id) || 0));
    const workSize = d3.scaleSqrt().domain([0, maxCites]).range([7, 18]);

    const kwParts = [];
    if (keywordWork) kwParts.push(`works="${keywordWork}"`);
    if (keywordFwd) kwParts.push(`forward="${keywordFwd}"`);
    if (keywordBack) kwParts.push(`backward="${keywordBack}"`);
    const kwSummary = kwParts.length ? `, keywords ${kwParts.join(', ')}` : '';
    metaEl.textContent = `${finalNodes.length} nodes, ${finalLinks.length} links (forward≥${activeFilters.thFwd}, backward≥${activeFilters.thBack}, years ${activeFilters.minYear}-${activeFilters.maxYear}${kwSummary})`;
    computeInitialPositions({nodes: finalNodes});

    const refSize = d3.scaleSqrt()
      .domain(d3.extent(finalNodes.filter(d => d.type==='ref').map(d => d.count || 1)) || [1,1])
      .range([8, 24]);
    const nodeFill = buildNodeFill(finalNodes, activeFilters);

    const link = gLinks.selectAll('line').data(finalLinks, d => {
      const s = String(typeof d.source === 'object' ? d.source.id : d.source);
      const t = String(typeof d.target === 'object' ? d.target.id : d.target);
      return `${s}->${t}->${d.kind||'forward'}`;
    });
    link.join(
      enter => enter.append('line')
        .attr('class', d => `link ${d.kind === 'back' ? 'back' : ''}`)
        .attr('stroke-width', 1.2),
      update => update.attr('class', d => `link ${d.kind === 'back' ? 'back' : ''}`),
      exit => exit.remove()
    );

    const node = gNodes.selectAll('circle').data(finalNodes, d => d.id);
    const nodeJoin = node.join(
      enter => enter.append('circle')
        .attr('class', d => `node ${d.type}`)
        .attr('fill', d => nodeFill(d))
        .attr('r', d =>
          d.type === 'ref' ? refSize(d.count || 1) :
          d.type === 'ref_back' ? 8 :
          workSize(workCiteCount.get(String(d.id)) || 0)
        ),
      update => update
        .attr('fill', d => nodeFill(d))
        .attr('r', d =>
          d.type === 'ref' ? refSize(d.count || 1) :
          d.type === 'ref_back' ? 8 :
          workSize(workCiteCount.get(String(d.id)) || 0)
        )
        .attr('class', d => `node ${d.type}`),
      exit => exit.remove()
    );
    nodeJoin
      .call(d3.drag().on('start', dragstarted).on('drag', dragged).on('end', dragended))
      .on('mouseover', (ev, d) => { showTooltip(ev, d); applyHighlight(d, true, refsByWorkFwd, worksByRefFwd, refsByWorkBack, worksByRefBack); })
      .on('mousemove', (ev) => { moveTooltip(ev); })
      .on('mouseout',  (ev, d) => { hideTooltip(); applyHighlight(d, false, refsByWorkFwd, worksByRefFwd, refsByWorkBack, worksByRefBack); })
      .on('contextmenu', (ev, d) => { ev.preventDefault(); showContextMenu(ev, d, false, finalNodes); })
      .on('dblclick', (ev, d) => { ev.preventDefault(); openDoi(d); });

    const label = gLabels.selectAll('text').data(finalNodes.filter(d => d.type==='ref'), d => d.id);
    label.join(
      enter => enter.append('text').attr('class','label').attr('text-anchor','middle')
        .attr('dy', d => -(refSize(d.count || 1) + 6)).text(d => truncate(d.title || d.id, 36)),
      update => update.text(d => truncate(d.title || d.id, 36)).attr('dy', d => -(refSize(d.count || 1) + 6)),
      exit => exit.remove()
    );

    const refNodes = finalNodes.filter(d => d.type==='ref');
    sim.nodes(refNodes).alpha(0.7).restart().on('tick', () => {
      gLinks.selectAll('line')
        .attr('x1', d => nodeById(d.source, finalNodes).x)
        .attr('y1', d => nodeById(d.source, finalNodes).y)
        .attr('x2', d => nodeById(d.target, finalNodes).x)
        .attr('y2', d => nodeById(d.target, finalNodes).y);
      gNodes.selectAll('circle').attr('cx', d => d.x).attr('cy', d => d.y);
      gLabels.selectAll('text').attr('x', d => d.x).attr('y', d => d.y - 2);
    });
    updateAuthorsList();
    applyAuthorHighlight();
  }

  function renderCommunity(data, activeFilters){
    sim.stop();
    const safeData = JSON.parse(JSON.stringify(data || {nodes: [], links: []}));
    const {nodes: finalNodes, links: finalLinks, keywordWork, keywordFwd, keywordBack} = filterData(safeData, activeFilters);
    currentVisibleNodes = finalNodes;
    currentVisibleLinks = finalLinks;

    gRings.selectAll('circle').remove();

    const communityIds = Array.from(new Set(finalNodes.map(n => (n.community ?? -1)))).sort((a,b)=>a-b);
    const color = d3.scaleOrdinal()
      .domain(communityIds)
      .range(communityIds.map((_, i) => d3.interpolateRainbow(i / Math.max(1, communityIds.length))));

    const R = Math.min(width, height) * 0.38;
    const centers = new Map();
    communityIds.forEach((cid, i) => {
      const theta = i * 2.399963229728653; // golden angle
      const radius = R * Math.sqrt((i + 1) / Math.max(1, communityIds.length));
      centers.set(cid, {x: width/2 + radius * Math.cos(theta), y: height/2 + radius * Math.sin(theta)});
    });

    const workIds = finalNodes.filter(n => n.type === 'work').map(n => String(n.id));
    const workCiteCount = new Map(workIds.map(id => [id, 0]));
    for (const l of finalLinks) {
      const s = String(typeof l.source === 'object' ? l.source.id : l.source);
      const t = String(typeof l.target === 'object' ? l.target.id : l.target);
      if (String(l.kind || '') === 'back' && workCiteCount.has(s)) {
        workCiteCount.set(s, workCiteCount.get(s) + 1);
      }
    }
    const maxCites = Math.max(1, ...workIds.map(id => workCiteCount.get(id) || 0));
    const workSize = d3.scaleSqrt().domain([0, maxCites]).range([7, 18]);
    const refSize = d3.scaleSqrt()
      .domain(d3.extent(finalNodes.filter(d => d.type==='ref').map(d => d.count || 1)) || [1,1])
      .range([8, 24]);
    const nodeFill = buildNodeFill(finalNodes, activeFilters, color);

    const kwParts = [];
    if (keywordWork) kwParts.push(`works="${keywordWork}"`);
    if (keywordFwd) kwParts.push(`forward="${keywordFwd}"`);
    if (keywordBack) kwParts.push(`backward="${keywordBack}"`);
    const kwSummary = kwParts.length ? `, keywords ${kwParts.join(', ')}` : '';
    metaEl.textContent = `${finalNodes.length} nodes, ${finalLinks.length} links (communities ${communityIds.length}, resolution ${activeFilters.resolution}, years ${activeFilters.minYear}-${activeFilters.maxYear}${kwSummary})`;

    const link = gLinks.selectAll('line').data(finalLinks, d => {
      const s = String(typeof d.source === 'object' ? d.source.id : d.source);
      const t = String(typeof d.target === 'object' ? d.target.id : d.target);
      return `${s}->${t}->${d.kind||'forward'}`;
    });
    link.join(
      enter => enter.append('line')
        .attr('class', d => `link ${d.kind === 'back' ? 'back' : ''}`)
        .attr('stroke-width', 1.1),
      update => update.attr('class', d => `link ${d.kind === 'back' ? 'back' : ''}`),
      exit => exit.remove()
    );

    const node = gNodes.selectAll('circle').data(finalNodes, d => d.id);
    const nodeJoin = node.join(
      enter => enter.append('circle')
        .attr('class', 'node')
        .attr('r', d =>
          d.type === 'ref' ? refSize(d.count || 1) :
          d.type === 'ref_back' ? 8 :
          workSize(workCiteCount.get(String(d.id)) || 0)
        )
        .attr('fill', d => nodeFill(d))
        .on('mouseover', (ev, d) => { showTooltip(ev, d); })
        .on('mousemove', (ev) => { moveTooltip(ev); })
        .on('mouseout',  () => { hideTooltip(); })
        .on('contextmenu', (ev, d) => { ev.preventDefault(); showContextMenu(ev, d, true, finalNodes); })
        .on('dblclick', (ev, d) => { ev.preventDefault(); openDoi(d); }),
      update => update
        .attr('r', d =>
          d.type === 'ref' ? refSize(d.count || 1) :
          d.type === 'ref_back' ? 8 :
          workSize(workCiteCount.get(String(d.id)) || 0)
        )
        .attr('class', 'node')
        .attr('fill', d => nodeFill(d))
        .on('mouseover', (ev, d) => { showTooltip(ev, d); })
        .on('mousemove', (ev) => { moveTooltip(ev); })
        .on('mouseout',  () => { hideTooltip(); })
        .on('contextmenu', (ev, d) => { ev.preventDefault(); showContextMenu(ev, d, true, finalNodes); })
        .on('dblclick', (ev, d) => { ev.preventDefault(); openDoi(d); }),
      exit => exit.remove()
    );
    nodeJoin.on('.drag', null);

    const label = gLabels.selectAll('text').data([], d => d.id);
    label.join(
      enter => enter,
      update => update,
      exit => exit.remove()
    );

    finalNodes.forEach(n => {
      const center = centers.get(n.community ?? -1) || {x: width/2, y: height/2};
      n.x = center.x + (Math.random()-0.5)*60;
      n.y = center.y + (Math.random()-0.5)*60;
      n.fx = null;
      n.fy = null;
    });

    simCommunity.nodes(finalNodes)
      .force('charge', d3.forceManyBody().strength(-35))
      .force('link', d3.forceLink(finalLinks).id(d => String(d.id)).distance(45).strength(0.12))
      .force('x', d3.forceX(d => (centers.get(d.community ?? -1) || {x: width/2}).x).strength(0.25))
      .force('y', d3.forceY(d => (centers.get(d.community ?? -1) || {y: height/2}).y).strength(0.25))
      .force('collide', d3.forceCollide().radius(d =>
        (d.type === 'ref' ? refSize(d.count || 1) : d.type === 'ref_back' ? 8 : workSize(workCiteCount.get(String(d.id)) || 0)) + 2
      ))
      .alpha(0.9)
      .alphaDecay(0.08)
      .restart()
      .on('tick', () => {
        gLinks.selectAll('line')
          .attr('x1', d => nodeById(d.source, finalNodes).x)
          .attr('y1', d => nodeById(d.source, finalNodes).y)
          .attr('x2', d => nodeById(d.target, finalNodes).x)
          .attr('y2', d => nodeById(d.target, finalNodes).y);
        gNodes.selectAll('circle').attr('cx', d => d.x).attr('cy', d => d.y);
      });
    updateAuthorsList();
    applyAuthorHighlight();
  }

  function renderCurrent(){
    if (viewMode === 'community') {
      renderCommunity(communityData || fullData || {nodes: [], links: []}, filters);
    } else {
      renderGraph(fullData || {nodes: [], links: []}, filters);
    }
  }

  function nodeById(id, nodes){
    const key = String(typeof id === 'object' ? id.id : id);
    return nodes.find(n => String(n.id) === key) || {x:0, y:0};
  }

  function applyHighlight(d, on, refsByWorkFwd, worksByRefFwd, refsByWorkBack, worksByRefBack){
    gNodes.selectAll('circle').classed('neighbor', false);
    gLinks.selectAll('line').classed('highlight', false);
    if(!on) return;

    if(d.type === 'work'){
      const neighF = refsByWorkFwd.get(String(d.id))  || new Set();
      const neighB = refsByWorkBack.get(String(d.id)) || new Set();
      gNodes.selectAll('circle').filter(n => n.type === 'ref' && neighF.has(String(n.id))).classed('neighbor', true);
      gNodes.selectAll('circle').filter(n => n.type === 'ref_back' && neighB.has(String(n.id))).classed('neighbor', true);
      gLinks.selectAll('line').classed('highlight', l => {
        const s = String(typeof l.source === 'object' ? l.source.id : l.source);
        const t = String(typeof l.target === 'object' ? l.target.id : l.target);
        if(s !== String(d.id)) return false;
        return (l.kind === 'back') ? neighB.has(t) : neighF.has(t);
      });

    } else if(d.type === 'ref'){
      const neighW = worksByRefFwd.get(String(d.id)) || new Set();
      gNodes.selectAll('circle').filter(n => n.type === 'work' && neighW.has(String(n.id))).classed('neighbor', true);
      gLinks.selectAll('line').classed('highlight', l => {
        const s = String(typeof l.source === 'object' ? l.source.id : l.source);
        const t = String(typeof l.target === 'object' ? l.target.id : l.target);
        return (l.kind !== 'back') && t === String(d.id) && neighW.has(s);
      });

    } else if(d.type === 'ref_back'){
      const neighW = worksByRefBack.get(String(d.id)) || new Set();
      gNodes.selectAll('circle').filter(n => n.type === 'work' && neighW.has(String(n.id))).classed('neighbor', true);
      gLinks.selectAll('line').classed('highlight', l => {
        const s = String(typeof l.source === 'object' ? l.source.id : l.source);
        const t = String(typeof l.target === 'object' ? l.target.id : l.target);
        return (l.kind === 'back') && t === String(d.id) && neighW.has(s);
      });
    }
  }

  function dragstarted(event, d){ if(!event.active) sim.alpha(0.3).restart(); d.fx = d.x; d.fy = d.y; }
  function dragged(event, d){ d.fx = event.x; d.fy = event.y; }
  function dragended(event, d){ if(d.type === 'ref'){ d.fx = null; d.fy = null; } else { d.fx = d.x; d.fy = d.y; } }

  function showTooltip(ev, d){
    const lines = [];
    if (d.title)   lines.push('<div class="row"><strong>Title:</strong> ' + escapeHTML(d.title) + '</div>');
    if (d.authors && d.authors.length) lines.push('<div class="row"><strong>Authors:</strong> ' + escapeHTML(d.authors.join(', ')) + '</div>');
    if (d.venue)   lines.push('<div class="row"><strong>Venue:</strong> ' + escapeHTML(d.venue) + '</div>');
    if (Number.isFinite(Number(d.publication_year))) lines.push('<div class="row"><strong>Publication year:</strong> ' + escapeHTML(String(d.publication_year)) + '</div>');
    if (d.doi)     lines.push('<div class="row"><strong>DOI:</strong> <a href="' + d.doi + '" target="_blank">' + escapeHTML(d.doi) + '</a></div>');
    if (d.openalex)lines.push('<div class="row"><strong>OpenAlex:</strong> <a href="' + d.openalex + '" target="_blank">' + escapeHTML(d.openalex) + '</a></div>');
    if (Number.isFinite(d.count)) lines.push('<div class="row"><strong>Connections to input works:</strong> ' + d.count + '</div>');
    const kind = d.type === 'work' ? 'Work' : (d.type === 'ref_back' ? 'Backward reference' : 'Reference');
    tooltip.innerHTML = '<h3>' + kind + '</h3>' + lines.join('');
    tooltip.style.display = 'block';
    moveTooltip(ev);
  }
  function moveTooltip(ev){ tooltip.style.left = (ev.clientX + 14) + 'px'; tooltip.style.top = (ev.clientY + 14) + 'px'; }
  function hideTooltip(){ tooltip.style.display = 'none'; }

  function copyOpenAlex(d){
    let text = '';
    if (d.openalex) text = d.openalex;
    else if (String(d.id).startsWith('W')) text = 'https://openalex.org/' + d.id;
    if (text) {
      navigator.clipboard.writeText(text).then(() => {
        metaEl.textContent = 'Copied ' + text;
        setTimeout(() => { metaEl.textContent = ''; }, 2000);
      }).catch(()=>{});
    }
  }

  function openDoi(d){
    const url = d.doi || (d.openalex ? d.openalex : '');
    if (url) window.open(url, '_blank');
  }

  function exportCommunityCSVFromNodes(node, nodes, label){
    if (!node || !nodes) return;
    const communityId = node.community ?? -1;
    const rows = nodes.filter(n => (n.community ?? -1) === communityId);
    if (!rows.length) return;
    const header = ['id','title','doi','openalex','venue','publication_year','type','authors'];
    const escapeCSV = (val) => {
      const s = String(val ?? '');
      if (s.includes('"') || s.includes(',') || s.includes('\n')) {
        return `"${s.replace(/"/g, '""')}"`;
      }
      return s;
    };
    const lines = [header.join(',')];
    for (const n of rows) {
      const line = [
        escapeCSV(n.id),
        escapeCSV(n.title),
        escapeCSV(n.doi),
        escapeCSV(n.openalex),
        escapeCSV(n.venue),
        escapeCSV(n.publication_year),
        escapeCSV(n.type),
        escapeCSV((n.authors || []).join('; '))
      ];
      lines.push(line.join(','));
    }
    const blob = new Blob([lines.join('\n')], {type: 'text/csv;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `community_${communityId}_${label}.csv`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    metaEl.textContent = `Exported community ${communityId} (${rows.length} papers, ${label})`;
  }

  function openPaper(d){
    const url = d.openalex || d.doi || (String(d.id).startsWith('W') ? ('https://openalex.org/' + d.id) : '');
    if (url) window.open(url, '_blank');
  }

  function showContextMenu(ev, node, allowExport, nodes){
    ctxNode = node;
    ctxVisibleNodes = nodes || null;

    ctxExportVisible.disabled = !allowExport;

    ctxExportVisible.style.display = allowExport ? 'block' : 'none';

  function hideContextMenu(){
    ctxMenu.style.display = 'none';
    ctxNode = null;
  }

  function collectAuthors(nodes){
    const counts = new Map();
    for (const n of nodes || []) {
      const authors = n.authors || [];
      for (const a of authors) {
        const name = String(a || '').trim();
        if (!name) continue;
        if (!counts.has(name)) counts.set(name, {work: 0, ref: 0, ref_back: 0});
        const bucket = counts.get(name);
        if (n.type === 'work') bucket.work += 1;
        else if (n.type === 'ref') bucket.ref += 1;
        else if (n.type === 'ref_back') bucket.ref_back += 1;
      }
    }
    return Array.from(counts.entries())
      .map(([name, c]) => ({name, counts: c}))
      .sort((a, b) => a.name.localeCompare(b.name));
  }

  function updateAuthorsList(){
    const filter = String(authorsFilterEl.value || '').trim().toLowerCase();
    const authors = collectAuthors(currentVisibleNodes)
      .filter(a => a.name.toLowerCase().includes(filter));
    authorsListEl.innerHTML = '';
    if (!authors.length) {
      const div = document.createElement('div');
      div.className = 'muted';
      div.textContent = 'No authors found';
      authorsListEl.appendChild(div);
      return;
    }
    for (const a of authors) {
      const btn = document.createElement('button');
      btn.className = 'item';
      btn.textContent = `${a.name} (w:${a.counts.work}, f:${a.counts.ref}, b:${a.counts.ref_back})`;
      if (a.name === selectedAuthor) {
        btn.style.background = '#1f2a36';
      }
      btn.onclick = () => {
        selectedAuthor = a.name;
        applyAuthorHighlight();
      };
      authorsListEl.appendChild(btn);
    }
  }

  function applyAuthorHighlight(){
    const name = String(selectedAuthor || '').trim();
    gNodes.selectAll('circle').classed('author-hit', false);
    gLinks.selectAll('line').classed('author-hit', false);
    if (!name) return;

    const nodeMap = new Map((currentVisibleNodes || []).map(n => [String(n.id), n]));
    const hitNodes = new Set();
    for (const n of currentVisibleNodes || []) {
      const authors = (n.authors || []).map(a => String(a));
      if (authors.includes(name)) {
        hitNodes.add(String(n.id));
      }
    }

    gNodes.selectAll('circle').filter(d => hitNodes.has(String(d.id))).classed('author-hit', true);

    gLinks.selectAll('line').classed('author-hit', l => {
      const s = String(typeof l.source === 'object' ? l.source.id : l.source);
      const t = String(typeof l.target === 'object' ? l.target.id : l.target);
      return hitNodes.has(s) || hitNodes.has(t);
    });
  }

  function resetLayout(){
    if (!fullData) return;
    if (viewMode !== 'graph') {
      viewMode = 'graph';
      btnCommunities.textContent = 'Communities';
      currentDataURL = DATA_URL;
    }
    const resetNodes = (nodes) => {
      for (const n of nodes || []) {
        delete n.x; delete n.y; delete n.vx; delete n.vy; delete n.fx; delete n.fy;
        delete n.initialX; delete n.initialY;
      }
    };
    resetNodes(fullData.nodes);
    if (communityData && communityData.nodes) resetNodes(communityData.nodes);
    simCommunity.stop();
    sim.stop();
    renderGraph(fullData, filters);
  }

  function communityURL(){
    return `/network/communities/{{work_list_id}}?resolution=${encodeURIComponent(filters.resolution)}`;
  }

  function loadCommunityData(){
    const url = communityURL();
    if (communityData && communityResolution === filters.resolution) {
      currentDataURL = url;
      renderCurrent();
      return;
    }
    metaEl.textContent = 'Loading communities…';
    fetch(url)
      .then(r => r.json())
      .then(data => {
        communityData = data;
        communityResolution = filters.resolution;
        currentDataURL = url;
        renderCurrent();
      })
      .catch(err => { metaEl.textContent = 'Error loading communities: ' + err; });
  }

  function syncFilterUI(){
    thFwdEl.value = String(filters.thFwd);
    thBackEl.value = String(filters.thBack);
    thFwdVal.textContent = String(filters.thFwd);
    thBackVal.textContent = String(filters.thBack);
    minYearEl.value = String(filters.minYear);
    maxYearEl.value = String(filters.maxYear);
    resolutionEl.value = String(filters.resolution);
    shadeByAgeEl.checked = !!filters.shadeByAge;
    shadeSensitivityEl.value = String(filters.shadeSensitivity);
    shadeSensitivityVal.textContent = Number(filters.shadeSensitivity).toFixed(1);
    kwWorkEl.value = filters.keywordWork;
    kwFwdEl.value = filters.keywordFwd;
    kwBackEl.value = filters.keywordBack;
  }

  function applyFiltersFromUI(){
    const minYear = parseInt(minYearEl.value, 10);
    const maxYear = parseInt(maxYearEl.value, 10);
    const resolution = parseFloat(resolutionEl.value);
    const shadeSensitivity = parseFloat(shadeSensitivityEl.value);
    filters.thFwd = parseInt(thFwdEl.value, 10);
    filters.thBack = parseInt(thBackEl.value, 10);
    filters.minYear = Number.isFinite(minYear) ? minYear : 1900;
    filters.maxYear = Number.isFinite(maxYear) ? maxYear : currentYear;
    filters.resolution = Number.isFinite(resolution) && resolution > 0 ? resolution : 1.0;
    filters.shadeByAge = !!shadeByAgeEl.checked;
    filters.shadeSensitivity = Number.isFinite(shadeSensitivity) && shadeSensitivity > 0 ? shadeSensitivity : 1.0;
    shadeSensitivityVal.textContent = filters.shadeSensitivity.toFixed(1);
    if (filters.minYear > filters.maxYear) {
      const tmp = filters.minYear;
      filters.minYear = filters.maxYear;
      filters.maxYear = tmp;
    }
    filters.keywordWork = String(kwWorkEl.value || '').trim();
    filters.keywordFwd = String(kwFwdEl.value || '').trim();
    filters.keywordBack = String(kwBackEl.value || '').trim();
    thFwdVal.textContent = String(filters.thFwd);
    thBackVal.textContent = String(filters.thBack);
    if (viewMode === 'community') {
      loadCommunityData();
    } else {
      renderCurrent();
    }
  }

  thFwdEl.oninput = () => { thFwdVal.textContent = thFwdEl.value; applyFiltersFromUI(); };
  thBackEl.oninput = () => { thBackVal.textContent = thBackEl.value; applyFiltersFromUI(); };
  minYearEl.oninput = () => applyFiltersFromUI();
  maxYearEl.oninput = () => applyFiltersFromUI();
  resolutionEl.oninput = () => applyFiltersFromUI();
  shadeByAgeEl.oninput = () => applyFiltersFromUI();
  shadeSensitivityEl.oninput = () => applyFiltersFromUI();
  kwWorkEl.oninput = () => applyFiltersFromUI();
  kwFwdEl.oninput = () => applyFiltersFromUI();
  kwBackEl.oninput = () => applyFiltersFromUI();
  authorsFilterEl.oninput = () => updateAuthorsList();
  authorsResetEl.onclick = () => { selectedAuthor = ''; applyAuthorHighlight(); updateAuthorsList(); };
  btnAuthors.onclick = () => {
    const show = authorsPanel.style.display !== 'block';
    authorsPanel.style.display = show ? 'block' : 'none';
    if (show) updateAuthorsList();
  };

  function fitToView(){
    const pad = 40;
    const renderedNodes = Array.from(gNodes.selectAll('circle').data());
    if (renderedNodes.length === 0) return;
    const xs = renderedNodes.map(d => d.x), ys = renderedNodes.map(d => d.y);
    const minX = Math.min(...xs) - pad, maxX = Math.max(...xs) + pad;
    const minY = Math.min(...ys) - pad, maxY = Math.max(...ys) + pad;
    const widthVB = Math.max(1, maxX - minX), heightVB = Math.max(1, maxY - minY);
    const k = Math.min(svg.node().clientWidth / widthVB, svg.node().clientHeight / heightVB);
    svg.transition().duration(450).call(
      zoom.transform,
      d3.zoomIdentity
        .translate(svg.node().clientWidth/2, svg.node().clientHeight/2)
        .scale(isFinite(k) ? k : 1)
        .translate(-(minX + widthVB/2), -(minY + heightVB/2))
    );
  }

  // Initial data fetch
  fetch(DATA_URL)
    .then(r => r.json())
    .then(data => {
      fullData = data;
      currentDataURL = DATA_URL;
      filters.maxYear = currentYear;
      filters.minYear = 1900;
      filters.thFwd = parseInt(thFwdEl.value, 10);
      filters.thBack = parseInt(thBackEl.value, 10);
      filters.resolution = parseFloat(resolutionEl.value) || 1.0;
      filters.shadeSensitivity = parseFloat(shadeSensitivityEl.value) || 1.0;
      renderCurrent();
    })
    .catch(err => { metaEl.textContent = 'Error loading data: ' + err; });

  // Utils
  function truncate(s, n) {
    s = s || '';
    return s.length > n ? s.slice(0, n - 1) + '\u2026' : s;
  }
  function escapeHTML(s) {
    const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
    return String(s).replace(/[&<>"']/g, ch => map[ch]);
  }
  </script>
</body>
